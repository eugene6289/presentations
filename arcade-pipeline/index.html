<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>金好運遊戲館流程串接</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f4f6fb;
  --surface: #ffffff;
  --ink: #1a2140;
  --sub: #5b657e;
  --mute: #8a93ab;
  --line: #dbe0ec;
  --night: #1d2660;
  --night-2: #141b4a;
  --night-sub: #b9c2ea;
  --gold: #f4bb1f;
  --gold-soft: #fff5d6;
  --gold-line: #e5b52f;
  --indigo: #3a4bd0;
  --indigo-soft: #eceffd;
  --red: #c4412a;
  --red-soft: #fdeee9;
  --green: #1f8a5b;
  --green-soft: #e5f5ec;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; }
body {
  background: #0e1335;
  color: var(--ink);
  font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
}
.mono { font-family: "JetBrains Mono", ui-monospace, monospace; }

/* ---------- stage & scaling ---------- */
#stage {
  position: absolute; left: 50%; top: 50%;
  width: 1280px; height: 720px;
  transform-origin: center center;
}
.slide {
  position: absolute; inset: 0;
  background: var(--bg);
  padding: 52px 68px 64px;
  flex-direction: column;
  overflow: hidden;
}
.slide {
  display: flex;
  opacity: 0; visibility: hidden;
  transform: translateX(60px) scale(.985);
  transition: opacity .5s ease, transform .6s cubic-bezier(.2,.7,.2,1), visibility 0s linear .6s;
}
.slide.before { transform: translateX(-60px) scale(.985); }
.slide.active {
  opacity: 1; visibility: visible; transform: none;
  transition: opacity .5s ease, transform .6s cubic-bezier(.2,.7,.2,1), visibility 0s;
}

/* ---------- entrance animations ---------- */
.rv { opacity: 0; }
.slide.active .rv { animation: rise .6s cubic-bezier(.2,.7,.2,1) var(--d, 0ms) both; }
svg .rv { transform-box: fill-box; transform-origin: center; }
.slide.active .kpi.rv,
.slide.active .decide .card.rv,
.slide.active .st.rv,
.slide.active svg .rv.pop { animation-name: pop; }
.slide.active .shot.rv { animation-name: fromRight; }
.slide.active .demo li.rv { animation: bounce .7s cubic-bezier(.3,1.6,.5,1) var(--d) both; }
.slide.active .flowrow.now .chip.rv { animation-name: popGold; }
@keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
@keyframes pop { from { opacity: 0; transform: scale(.86); } to { opacity: 1; transform: none; } }
@keyframes fromLeft { from { opacity: 0; transform: translateX(-36px); } to { opacity: 1; transform: none; } }
@keyframes fromRight { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: none; } }
@keyframes bounce { 0% { opacity: 0; transform: translateY(24px) scale(.8); } 100% { opacity: 1; transform: none; } }
@keyframes popGold {
  0% { opacity: 0; transform: scale(.8); }
  60% { opacity: 1; transform: scale(1.06); box-shadow: 0 0 0 6px rgba(244,187,31,.35); }
  100% { opacity: 1; transform: none; box-shadow: 0 0 0 0 rgba(244,187,31,0); }
}

/* svg arrows draw themselves */
.draw { stroke-dasharray: 1; stroke-dashoffset: 1; opacity: 0; }
.slide.active .draw { animation: draw .7s ease var(--d, 0ms) forwards; }
@keyframes draw { 0% { opacity: 0; stroke-dashoffset: 1; } 15% { opacity: 1; } 100% { opacity: 1; stroke-dashoffset: 0; } }
.slide.active .ants { animation: ants 1.1s linear infinite; }
@keyframes ants { to { stroke-dashoffset: -24; } }

/* loops: things we want eyes on */
.slide.active .pulse { animation: pulse 1.8s ease-in-out 2s infinite; transform-box: fill-box; transform-origin: center; }
@keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.18); } }
.slide.active .st.ai.rv, .slide.active .st.aisug.rv { animation: pop .6s cubic-bezier(.2,.7,.2,1) var(--d) both, glow 2s ease-in-out calc(var(--d) + .6s) infinite; }
@keyframes glow { 0%, 100% { box-shadow: 0 0 0 0 rgba(244,187,31,0); } 50% { box-shadow: 0 0 0 4px rgba(244,187,31,.55); } }
.slide.active .goldcard.rv { animation: rise .6s cubic-bezier(.2,.7,.2,1) var(--d) both, flash 1.2s ease calc(var(--d) + .6s) 1; }
@keyframes flash { 40% { box-shadow: 0 0 0 8px rgba(244,187,31,.45); } 100% { box-shadow: 0 0 0 0 rgba(244,187,31,0); } }
.slide.active .shake.rv { animation: rise .6s cubic-bezier(.2,.7,.2,1) var(--d) both, shake .5s ease calc(var(--d) + .6s) 1; }
@keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }

/* cover ken burns + shimmer */
.slide.active.cover .bgimg { animation: kenburns 14s ease-out both; }
@keyframes kenburns { from { transform: scale(1.12); } to { transform: scale(1); } }
.shimmer {
  background: linear-gradient(100deg, var(--gold) 0%, var(--gold) 40%, #fff6cf 50%, var(--gold) 60%, var(--gold) 100%);
  background-size: 250% 100%;
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.slide.active .shimmer { animation: shimmer 3.2s ease-in-out 1.2s infinite; }
@keyframes shimmer { from { background-position: 100% 0; } to { background-position: -150% 0; } }
.closing .qa.shimmer { background-image: linear-gradient(100deg, #fff 0%, #fff 40%, var(--gold) 50%, #fff 60%, #fff 100%); }

/* typing caret */
.say.typing::after { content: "▍"; margin-left: 2px; animation: caret .8s steps(1) infinite; color: var(--gold); }
@keyframes caret { 50% { opacity: 0; } }

/* top progress bar */
#progress { position: fixed; left: 0; top: 0; height: 4px; z-index: 12; background: var(--gold); width: 0; transition: width .6s cubic-bezier(.2,.7,.2,1); box-shadow: 0 0 10px rgba(244,187,31,.6); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .rv { opacity: 1 !important; }
  .draw { stroke-dashoffset: 0 !important; opacity: 1 !important; }
}
.slide.dark { background: var(--night); color: #fff; }

.eyebrow {
  display: flex; align-items: center; gap: 10px;
  font-size: 14px; font-weight: 700; letter-spacing: .08em;
  color: var(--indigo);
}
.eyebrow .num {
  display: grid; place-items: center;
  width: 30px; height: 30px; border-radius: 50%;
  background: var(--gold); color: var(--ink);
  font-family: "JetBrains Mono", monospace; font-size: 13px;
}
.title { margin-top: 12px; font-size: 34px; font-weight: 900; line-height: 1.25; letter-spacing: .01em; }
.subtitle { margin-top: 8px; font-size: 17px; color: var(--sub); line-height: 1.6; }
.body { flex: 1; min-height: 0; margin-top: 26px; display: flex; }
.hl { color: var(--red); font-weight: 700; }
.gd { background: linear-gradient(transparent 58%, rgba(244,187,31,.45) 58%); font-weight: 700; }

.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 20px 22px;
}
.tag {
  display: inline-block;
  padding: 2px 10px; border-radius: 999px;
  font-size: 12.5px; font-weight: 700;
}
.tag.gold { background: var(--gold-soft); color: #8a6100; border: 1px solid var(--gold-line); }
.tag.indigo { background: var(--indigo-soft); color: var(--indigo); }
.tag.red { background: var(--red-soft); color: var(--red); }
.tag.green { background: var(--green-soft); color: var(--green); }
.tag.gray { background: #eef0f5; color: var(--sub); }

/* ---------- cover ---------- */
.cover { padding: 0; }
.cover .bgimg {
  position: absolute; inset: 0;
  background-size: cover; background-position: center;
  opacity: .42;
}
.cover .shade {
  position: absolute; inset: 0;
  background: linear-gradient(90deg, rgba(20,27,74,.97) 0%, rgba(20,27,74,.86) 48%, rgba(20,27,74,.25) 100%);
}
.cover .inner { position: relative; padding: 0 76px; height: 100%; display: flex; flex-direction: column; justify-content: center; }
.cover .kicker { color: var(--gold); font-size: 16px; font-weight: 700; letter-spacing: .14em; }
.cover h1 { margin-top: 18px; font-size: 64px; font-weight: 900; line-height: 1.15; }
.cover h2 { margin-top: 18px; font-size: 26px; font-weight: 500; color: #e6e9f8; line-height: 1.5; }
.cover h2 b { color: var(--gold); }
.cover .bgimg { will-change: transform; }
.cover h2 b.shimmer { color: transparent; }
.cover .meta { margin-top: 44px; display: flex; gap: 14px; flex-wrap: wrap; color: var(--night-sub); font-size: 15px; }
.cover .meta span { padding: 6px 14px; border: 1px solid rgba(185,194,234,.35); border-radius: 999px; }

/* ---------- 01 why ---------- */
.why { gap: 26px; width: 100%; align-items: center; padding-bottom: 30px; }
.why .compare { flex: 1.25; display: flex; flex-direction: column; gap: 14px; }
.flowrow { display: flex; align-items: center; gap: 10px; }
.flowrow .lbl { width: 64px; flex: none; font-weight: 900; font-size: 17px; }
.flowrow .chip {
  flex: 1; padding: 13px 12px; border-radius: 10px;
  font-size: 15px; font-weight: 700; text-align: center; line-height: 1.35;
  background: #eef0f5; color: var(--sub);
}
.flowrow .arr { color: var(--mute); font-weight: 700; flex: none; }
.flowrow.now .chip { background: var(--gold-soft); color: var(--ink); border: 1px solid var(--gold-line); }
.flowrow.now .lbl { color: #a07000; }
.why .gaphd { display: flex; gap: 10px; font-size: 14px; font-weight: 900; color: var(--mute); letter-spacing: .04em; }
.why .gaphd span { flex: 1; padding-left: 4px; }
.why .gaphd span + span { margin-left: 22px; color: #a07000; }
.flowrow.gap { align-items: stretch; }
.flowrow.gap .arr { align-self: center; }
.flowrow.gap .chip { display: flex; align-items: center; text-align: left; padding: 14px 16px; }
.flowrow.gap .chip.fix { background: var(--gold-soft); color: var(--ink); border: 1px solid var(--gold-line); font-weight: 500; }
.flowrow.gap .chip.fix b { font-weight: 900; }
.why .note a.sheet { display: inline-block; margin-left: 10px; padding: 2px 12px; border-radius: 999px; background: var(--night); color: #fff; font-size: 14px; font-weight: 700; text-decoration: none; }
.why .note a.sheet:hover { background: var(--gold); color: var(--night); }
.why .note { margin-top: 6px; font-size: 15.5px; color: var(--sub); line-height: 1.75; }
.why .kpis { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 14px; align-content: start; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; }
.kpi .v { font-size: 44px; font-weight: 900; color: var(--night); line-height: 1.1; font-family: "JetBrains Mono", monospace; }
.kpi .v small { font-size: 18px; font-family: "Noto Sans TC", sans-serif; margin-left: 4px; }
.kpi .k { margin-top: 6px; font-size: 15px; font-weight: 700; }
.kpi .h { margin-top: 2px; font-size: 13px; color: var(--mute); line-height: 1.5; }

/* ---------- 02 steps ---------- */
.steps { width: 100%; gap: 26px; }
.steps .list { flex: 1; display: flex; flex-direction: column; gap: 14px; }
.step { display: flex; gap: 16px; align-items: flex-start; }
.step .coin {
  flex: none; display: grid; place-items: center;
  width: 44px; height: 44px; border-radius: 50%;
  background: var(--gold); color: var(--ink);
  font-weight: 900; font-size: 19px; font-family: "JetBrains Mono", monospace;
  box-shadow: inset 0 0 0 3px rgba(26,33,64,.18);
}
.step .t { font-size: 20px; font-weight: 900; line-height: 1.35; }
.step .d { margin-top: 3px; font-size: 14.5px; color: var(--sub); line-height: 1.65; }
.step .say {
  margin-top: 8px; padding: 9px 14px; border-radius: 10px 10px 10px 2px;
  background: var(--night); color: #fff; font-size: 14.5px; line-height: 1.55; display: inline-block;
}
.steps .footnote { margin-top: auto; font-size: 14px; color: var(--sub); padding: 12px 16px; border-left: 3px solid var(--gold); background: var(--surface); border-radius: 0 10px 10px 0; }
.steps .shots { flex: none; width: 520px; display: flex; flex-direction: column; gap: 12px; }
.shot { position: relative; border-radius: 12px; overflow: hidden; border: 1px solid var(--line); background: #0e1335; }
.shot img { display: block; width: 100%; }
.shot .cap {
  position: absolute; left: 10px; bottom: 10px;
  padding: 3px 10px; border-radius: 999px;
  background: rgba(20,27,74,.85); color: #fff; font-size: 12.5px; font-weight: 700;
}
.shotrow { display: flex; gap: 12px; }
.shotrow .shot { flex: 1; }

/* ---------- 04 swimlane ---------- */
.lanewrap { width: 100%; display: flex; flex-direction: column; margin-top: 4px; }
.zones { display: grid; grid-template-columns: 112px repeat(9, 1fr); gap: 0 6px; margin-bottom: 6px; }
.zones .z { grid-column: span 3; text-align: center; font-size: 12.5px; font-weight: 700; padding: 4px 0; border-radius: 8px; }
.zones .z.gl { background: #fbe7d9; color: #9a4a14; }
.zones .z.gh { grid-column: span 6; background: var(--indigo-soft); color: var(--indigo); }
.lane-grid { display: grid; grid-template-columns: 112px repeat(9, 1fr); gap: 5px; }
.lane-grid .sh {
  background: var(--night); color: #fff; border-radius: 8px;
  text-align: center; padding: 7px 2px; font-size: 14.5px; font-weight: 900; line-height: 1.2;
}
.lane-grid .sh span { display: block; font-size: 11px; font-weight: 500; color: var(--night-sub); margin-top: 2px; }
.lane-grid .rh {
  display: flex; align-items: center; padding-left: 12px;
  font-size: 14.5px; font-weight: 900; border-radius: 8px; background: var(--surface); border: 1px solid var(--line);
}
.lane-grid .rh i { width: 10px; height: 10px; border-radius: 50%; margin-right: 8px; flex: none; }
.lane-grid .cell {
  min-height: 44px; border-radius: 8px; background: rgba(58,75,208,.035);
  border: 1px dashed #d5dbea; padding: 5px; display: flex; flex-direction: column; gap: 4px; justify-content: center;
}
.lane-grid .cell .st {
  border-radius: 6px; padding: 3px 6px; font-size: 12px; font-weight: 700; line-height: 1.3;
  background: var(--surface); border: 1.5px solid #9aa4bd;
}
.lane-grid .cell .st em { font-style: normal; font-family: "JetBrains Mono", monospace; font-size: 10.5px; color: var(--mute); margin-right: 3px; }
.lane-grid .cell .st.user { background: var(--gold-soft); border-color: var(--gold-line); }
.lane-grid .cell .st.suggest { border-style: dashed; border-color: var(--red); }
.lane-grid .cell .st.ai { background: var(--night); border-color: var(--night); color: #fff; }
.lane-grid .cell .st.aisug { border: 1.5px dashed var(--night); }
.lane-grid .cell .st.aisug em { color: var(--night); font-weight: 700; }
.lane-grid .rh.airow { background: var(--night); color: var(--gold); border-color: var(--night); }
.lane-grid .cell .st.ai em { color: var(--gold); font-weight: 700; }
.lane-legend { margin-top: 8px; display: flex; gap: 20px; font-size: 13px; color: var(--sub); align-items: center; }
.lane-legend i { display: inline-block; width: 16px; height: 12px; border-radius: 4px; margin-right: 6px; vertical-align: -1px; }

/* ---------- rules hub ---------- */
.rules { width: 100%; gap: 28px; }
.rules .hub { flex: none; width: 520px; display: flex; flex-direction: column; }
.rules .hub svg { width: 520px; height: 360px; display: block; overflow: visible; }
.rules .hubnote { margin-top: 10px; font-size: 15px; font-weight: 700; color: var(--ink); padding: 10px 14px; border-left: 3px solid var(--gold); background: var(--surface); border-radius: 0 10px 10px 0; }
.rules .side { flex: 1; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.rules .defs { padding: 16px 20px; }
.rules .defs .dt { font-size: 15px; font-weight: 900; color: var(--indigo); letter-spacing: .04em; }
.rules .defs ul { list-style: none; margin-top: 8px; display: flex; flex-direction: column; gap: 7px; }
.rules .defs li { display: flex; gap: 12px; align-items: baseline; font-size: 14.5px; line-height: 1.5; }
.rules .defs li b { flex: none; width: 88px; font-weight: 900; }
.rules .defs li span { color: var(--sub); }
.rules .chg { padding: 14px 20px; background: var(--gold-soft); border-color: var(--gold-line); }
.rules .chg b { font-size: 15.5px; font-weight: 900; }
.rules .chg p { margin-top: 4px; font-size: 14.5px; line-height: 1.6; }

/* ---------- ai message ---------- */
.aimsg { width: 100%; display: grid; grid-template-columns: 1fr 300px; grid-template-rows: 1fr auto; gap: 16px 24px; }
.aimsg .term { border-radius: 12px; overflow: hidden; background: #0c1230; border: 1px solid #263070; box-shadow: 0 14px 30px rgba(20,27,74,.25); }
.aimsg .term .bar { display: flex; align-items: center; gap: 6px; padding: 8px 12px; background: #1b2257; }
.aimsg .term .bar i { width: 10px; height: 10px; border-radius: 50%; background: #3b4488; }
.aimsg .term .bar span { margin-left: 8px; font-size: 12px; color: #8f9bd8; font-family: "JetBrains Mono", monospace; }
.aimsg .term pre { padding: 12px 16px; font-family: "JetBrains Mono", "Noto Sans TC", monospace; font-size: 13px; line-height: 1.62; color: #dfe4ff; white-space: pre; }
.aimsg .term .dim { color: #8f9bd8; }
.aimsg .term .red { color: #ff8d7a; font-weight: 700; }
.aimsg .term .gold { color: var(--gold); font-weight: 700; }
.aimsg .tnote { margin-top: 6px; font-size: 12.5px; color: var(--mute); }
.aimsg .loop { display: flex; flex-direction: column; align-items: stretch; }
.aimsg .lp { display: flex; gap: 12px; align-items: center; padding: 10px 14px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); }
.aimsg .lp:nth-child(5) { background: var(--gold-soft); border-color: var(--gold-line); }
.aimsg .lp .no { flex: none; display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: var(--night); color: #fff; font-weight: 900; font-family: "JetBrains Mono", monospace; font-size: 13px; }
.aimsg .lp b { display: block; font-size: 16px; font-weight: 900; }
.aimsg .lp span { display: block; font-size: 13px; color: var(--sub); }
.aimsg .la { text-align: center; color: var(--mute); font-weight: 700; line-height: 1.3; }
.aimsg .back { margin-top: 10px; text-align: center; font-size: 14px; font-weight: 900; color: var(--indigo); }
.aimsg .strip { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); }
.aimsg .sg { display: flex; align-items: center; gap: 8px; font-size: 14px; }
.aimsg .sg b { font-weight: 900; }
.aimsg .sg span:last-child { color: var(--sub); }
.aimsg .sa { color: var(--mute); font-weight: 700; }
/* ---------- aigen ---------- */
.aigen { width: 100%; display: grid; grid-template-columns: 330px 1fr; grid-template-rows: 1fr auto; gap: 16px 24px; }
.aigen .flow { display: flex; flex-direction: column; justify-content: space-between; gap: 10px; }
.aigen .gs { flex: 1; display: flex; gap: 12px; align-items: center; padding: 10px 14px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); }
.aigen .gs .no { flex: none; display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: var(--night); color: #fff; font-weight: 900; font-family: "JetBrains Mono", monospace; font-size: 13px; }
.aigen .gs b { display: block; font-size: 16px; font-weight: 900; }
.aigen .gs span { display: block; margin-top: 2px; font-size: 13px; color: var(--sub); line-height: 1.45; }
.aigen .gallery { display: flex; flex-direction: column; justify-content: space-around; gap: 6px; padding: 10px 20px; }
.aigen .glbl { font-size: 13px; font-weight: 900; color: var(--indigo); letter-spacing: .04em; margin-bottom: 6px; }
.aigen .gitems { display: flex; align-items: flex-start; gap: 12px; }
.aigen .gim { margin: 0; width: 100px; text-align: center; }
.aigen .gim img { display: block; width: 100px; height: 100px; object-fit: cover; border-radius: 10px; border: 1px solid var(--line); background: #fff; }
.aigen .gim.ref img { border: 2px solid var(--gold-line); box-shadow: 0 0 0 3px var(--gold-soft); }
.aigen .gim.bad img { border: 1.5px dashed var(--red); opacity: .85; }
.aigen .gim.bad figcaption { color: var(--red); font-weight: 700; }
.aigen .gim.wide { width: 178px; }
.aigen .gim.wide img { width: 178px; }
.aigen .ggap { flex: 1; }
.aigen .gim figcaption { margin-top: 5px; font-size: 12px; color: var(--sub); line-height: 1.35; }
.aigen .garr { align-self: center; margin-top: -18px; font-size: 13px; font-weight: 900; color: var(--mute); white-space: nowrap; }
.aigen .gstat { grid-column: 1 / -1; display: flex; align-items: center; gap: 22px; padding: 12px 16px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); }
.aigen .gst { display: flex; align-items: center; gap: 8px; font-size: 14px; }
.aigen .gst b { font-weight: 900; }
.aigen .gstat em { margin-left: auto; font-style: normal; font-size: 13px; color: var(--mute); }
.aigen .gchip { flex: 1; padding: 8px 10px; border-radius: 10px; background: #fff; border: 1px solid var(--line); }
.aigen .gchip b { display: block; font-size: 13.5px; font-weight: 900; }
.aigen .gchip span { display: block; margin-top: 2px; font-size: 12px; color: var(--sub); line-height: 1.35; }
.aigen .gchip.bad { border: 1.5px dashed var(--red); }

.aigen .gchip.sum b { color: var(--gold); }
.aigen .gchip.sum span { color: rgba(255,255,255,.75); }
.aimsg .strip em { margin-left: auto; font-style: normal; font-size: 12.5px; color: var(--mute); max-width: 230px; line-height: 1.45; }

/* ---------- ai route ---------- */
.airoute { width: 100%; flex-direction: column; gap: 0; }
.airoute .src { display: flex; align-items: center; gap: 12px; padding: 12px 18px; border-radius: 12px; background: var(--night); color: #fff; }
.airoute .src b { font-size: 17px; font-weight: 900; color: var(--gold); }

.airoute .src .path b { font-size: 14px; color: #fff; }
.airoute .src .s { margin-left: auto; font-size: 13px; color: var(--night-sub); }
.airoute .arrows { display: grid; grid-template-columns: 1fr 1fr; padding: 4px 0; text-align: center; font-size: 13px; font-weight: 700; color: var(--indigo); margin-right: 0; }
.airoute .cks { display: grid; grid-template-columns: 1fr 56px 1fr; align-items: stretch; }
.airoute .ck { position: relative; background: var(--surface); border: 1.5px solid var(--line); border-radius: 14px; padding: 14px 18px 16px; }
.airoute .ck:first-child { border-color: var(--gold-line); }
.airoute .ck:last-child { border-color: var(--indigo); }
.airoute .hd { display: flex; align-items: center; gap: 8px; }
.airoute .hd .no { font-size: 20px; font-weight: 900; color: var(--indigo); }
.airoute .hd b { font-size: 19px; font-weight: 900; }
.airoute .hd .where { margin-left: auto; padding: 2px 10px; border-radius: 999px; background: var(--indigo-soft); color: var(--indigo); font-size: 12.5px; font-weight: 700; font-family: "JetBrains Mono", "Noto Sans TC", monospace; }
.airoute .when { margin-top: 4px; font-size: 13.5px; color: var(--sub); }
.airoute .lbl { margin-top: 10px; font-size: 12.5px; font-weight: 900; color: var(--mute); letter-spacing: .06em; }
.airoute ul { margin-top: 3px; padding-left: 18px; font-size: 14px; line-height: 1.6; }
.airoute ul.out li::marker { color: var(--gold-line); }
.airoute .ctag { position: absolute; top: -10px; right: 14px; padding: 1px 10px; border-radius: 999px; background: var(--red); color: #fff; font-size: 12px; font-weight: 700; }
.airoute .mid { display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 26px; font-weight: 900; color: var(--mute); }
.airoute .mid small { font-size: 11.5px; font-weight: 700; }
.airoute .foot { margin-top: 12px; display: flex; justify-content: space-between; gap: 20px; font-size: 13.5px; color: var(--sub); }
.airoute .foot span:last-child { color: var(--red); font-weight: 700; }
.slide.active .airoute .ck.rv { animation-name: pop; }

/* ---------- todo ---------- */
.todo { width: 100%; display: grid; grid-template-columns: 1.45fr 1fr 1fr 1fr 1fr; gap: 12px; align-items: stretch; padding-bottom: 20px; }
.todo .col { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 0 0 14px; overflow: hidden; }
.todo .who { padding: 10px 16px; font-size: 17px; font-weight: 900; color: #fff; background: var(--night); }
.todo .col.gold { border-color: var(--gold-line); background: var(--gold-soft); }
.todo .col.gold .who { background: var(--gold); color: var(--ink); }
.todo .col.purple .who { background: #7b5cd6; }
.todo .col.indigo .who { background: var(--indigo); }
.todo .col.green .who { background: var(--green); }
.todo .col.red .who { background: var(--red); }
.todo .grp { margin: 12px 16px 4px; font-size: 12.5px; font-weight: 900; color: var(--mute); letter-spacing: .06em; }
.todo ol { margin: 0 16px; padding-left: 18px; font-size: 14px; line-height: 1.55; display: flex; flex-direction: column; gap: 5px; }
.todo li::marker { font-family: "JetBrains Mono", monospace; font-weight: 700; color: var(--sub); }
.slide.active .todo .col.rv { animation-name: rise; }

/* ---------- next ---------- */
.next { width: 100%; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; align-content: center; padding-bottom: 20px; }
.next .card { padding: 18px 22px; }
.next .t { display: flex; align-items: center; gap: 10px; font-size: 19px; font-weight: 900; }
.next .t .n { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: var(--gold); font-size: 13px; font-family: "JetBrains Mono", monospace; }
.next .row { margin-top: 10px; display: flex; gap: 10px; align-items: baseline; font-size: 14.5px; line-height: 1.6; color: var(--sub); }
.next .row .tag { flex: none; }
.next .row.ai span:last-child { color: var(--ink); font-weight: 500; }
.next .foot { grid-column: 1 / -1; font-size: 14px; color: var(--mute); }
.slide.active .next .card.rv { animation-name: pop; }

/* ---------- 07 decisions ---------- */
.decide { width: 100%; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: auto auto; gap: 16px; align-content: center; padding-bottom: 30px; }
.decide .card { min-height: 190px; }
.decide .card { display: flex; flex-direction: column; padding: 18px 20px; }

.decide .q .n {
  flex: none; display: grid; place-items: center; width: 26px; height: 26px; border-radius: 50%;
  background: var(--red-soft); color: var(--red); font-size: 13px; font-family: "JetBrains Mono", monospace;
  margin-top: 1px;
}
.decide .why { margin-top: 8px; font-size: 14px; color: var(--sub); line-height: 1.65; }
.decide .sug { margin-top: auto; padding-top: 12px; font-size: 14px; line-height: 1.6; }
.decide .sug b { color: var(--indigo); margin-right: 4px; }
.decide .ask {
  background: var(--night); color: #fff; border: 0;
  justify-content: center;
}
.decide .ask .big { font-size: 22px; font-weight: 900; line-height: 1.45; }
.decide .ask p { margin-top: 10px; color: var(--night-sub); font-size: 14.5px; line-height: 1.7; }

/* ---------- closing ---------- */
.closing .inner { height: 100%; display: flex; flex-direction: column; justify-content: center; }
.closing .kicker { color: var(--gold); font-size: 15px; font-weight: 700; letter-spacing: .14em; }
.closing .roles { margin-top: 22px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.closing .role { border: 1px solid rgba(185,194,234,.3); border-radius: 14px; padding: 20px 22px; background: rgba(255,255,255,.04); }
.closing .role b { display: block; font-size: 15px; color: var(--gold); letter-spacing: .06em; }
.closing .role span { display: block; margin-top: 6px; font-size: 26px; font-weight: 900; line-height: 1.35; }
.closing .demo { margin-top: 34px; }
.closing .demo h3 { font-size: 16px; color: var(--night-sub); font-weight: 700; }
.closing .demo ul { margin-top: 12px; list-style: none; display: flex; gap: 12px; flex-wrap: wrap; }
.closing .demo li { padding: 10px 18px; border-radius: 999px; background: var(--gold); color: var(--ink); font-weight: 900; font-size: 16px; }
.closing .qa { margin-top: 36px; font-size: 44px; font-weight: 900; letter-spacing: .04em; }

/* ---------- nav ---------- */
#nav {
  position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%);
  display: flex; align-items: center; gap: 12px; z-index: 10;
  padding: 6px 12px; border-radius: 999px;
  background: rgba(14,19,53,.82); color: #fff;
  font-family: "JetBrains Mono", monospace; font-size: 13px;
  opacity: .35; transition: opacity .2s;
}
#nav:hover { opacity: 1; }
#nav button {
  border: 0; background: none; color: #fff; cursor: pointer;
  width: 26px; height: 26px; border-radius: 50%; font-size: 15px;
}
#nav button:hover { background: rgba(255,255,255,.15); }
#dots { display: flex; gap: 6px; }
#dots i { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.3); cursor: pointer; }
#dots i.on { background: var(--gold); }

/* ---------- speaker notes (press N) ---------- */
#notes {
  position: fixed; left: 16px; right: 16px; bottom: 56px; z-index: 11;
  max-width: 880px; margin: 0 auto;
  padding: 16px 20px; border-radius: 12px;
  background: rgba(14,19,53,.95); color: #e6e9f8;
  font-size: 16px; line-height: 1.75;
  display: none;
}
#notes.open { display: block; }
#notes b { color: var(--gold); margin-right: 8px; font-family: "JetBrains Mono", monospace; }
</style>
</head>

  <span id="navPos">01 / 09</span>

</nav>

    </div></section>`,

  aigen: d => `<section class="slide">${head(d)}<div class="body aigen">
      <div class="flow">${d.steps.map(([t, s], i) => `<div class="gs"><span class="no">${i + 1}</span><div><b>${t}</b><span>${s}</span></div></div>`).join('')}</div>
      <div class="gallery card">${d.rows.map(r => `<div class="grow"><div class="glbl">${r.lbl}</div><div class="gitems">${
        r.items.map(it => it.arrow ? `<span class="garr">${it.arrow}</span>` : it.gap ? '<span class="ggap"></span>'
          : it.chip ? `<span class="gchip${it.bad ? ' bad' : ''}${it.sum ? ' sum' : ''}"><b>${it.chip}</b><span>${it.sub}</span></span>`
          : `<figure class="gim${it.ref ? ' ref' : ''}${it.bad ? ' bad' : ''}${it.wide ? ' wide' : ''}"><img src="${it.src}" alt="${it.cap}"><figcaption>${it.cap}</figcaption></figure>`).join('')}</div></div>`).join('')}
      </div>
      <div class="gstat">${d.status.map(([c, t, s]) => `<span class="gst"><span class="tag ${c}">${s}</span><b>${t}</b></span>`).join('')}
        <em>${d.statusNote}</em></div>
    </div></section>`,

  airoute: d => `<section class="slide">${head(d)}<div class="body airoute">
      <div class="src"><span class="tag gold">規則</span><b>${d.source.t}</b><span class="path">${d.source.p}</span><span class="s">${d.source.s}</span></div>
      <div class="arrows"><span>↓ 讀同一份清單</span><span>↓ 讀同一份清單</span></div>
      <div class="cks">${d.checks.map(c => `<div class="ck">
          <div class="hd"><span class="no">${c.no}</span><b>${c.t}</b><span class="where">${c.where}</span></div>
          <div class="when">${c.when}</div>
          <div class="lbl">AI 做什麼</div><ul>${c.does.map(x => `<li>${x}</li>`).join('')}</ul>
          <div class="lbl">產出</div><ul class="out">${c.out.map(x => `<li>${x}</li>`).join('')}</ul>
          <span class="ctag">${c.tag}</span>
        </div>`).join('<div class="mid">→<small>進官網</small></div>')}</div>
      <div class="foot"><span>${d.alt}</span><span>${d.need}</span></div>
    </div></section>`,

  todo: d => `<section class="slide">${head(d)}<div class="body todo">
      ${d.cols.map(c => `<div class="col ${c.c}"><div class="who">${c.who}</div>
        ${c.first.length ? `<div class="grp">第一次</div><ol>${c.first.map(x => `<li>${x}</li>`).join('')}</ol>` : ''}
        <div class="grp">${c.who === '編導' ? '每次做遊戲' : '入選之後'}</div><ol>${c.daily.map(x => `<li>${x}</li>`).join('')}</ol></div>`).join('')}
    </div></section>`,

  next: d => `<section class="slide">${head(d)}<div class="body next">
      ${d.items.map((it, i) => `<div class="card"><div class="t"><span class="n">${i + 1}</span>${it.t}</div>
        <div class="row"><span class="tag gray">現在</span><span>${it.now}</span></div>
        <div class="row ai"><span class="tag gold">交給 AI</span><span>${it.ai}</span></div></div>`).join('')}
      <div class="foot">${d.foot}</div>
    </div></section>`,

  decide: d => `<section class="slide">${head(d)}<div class="body decide">
      ${d.items.map((it, i) => `<div class="card"><div class="q"><span class="n">${i + 1}</span>${it.q}</div><div class="why">${it.why}</div><div class="sug"><b>建議</b>${it.sug}</div></div>`).join('')}
      <div class="card ask"><div class="big">${d.ask.big}</div><p>${d.ask.p}</p></div>
    </div></section>`,

  closing: d => `<section class="slide dark closing"><div class="inner">
      <div class="kicker">${d.kicker}</div>
      <div class="roles">${d.roles.map(r => `<div class="role"><b>${r.b}</b><span>${r.s}</span></div>`).join('')}</div>
      <div class="demo"><h3>${d.demoTitle}</h3><ul>${d.demos.map(x => `<li>${x}</li>`).join('')}</ul></div>
      <div class="qa shimmer">Q &amp; A</div>
    </div></section>`,
};

/* =====================================================================
   mount, navigation, scaling, ?page=N
   ===================================================================== */
const stage = document.getElementById('stage');
stage.innerHTML = slideData.map(d => R[d.type](d)).join('');
const slides = [...stage.querySelectorAll('.slide')];

/* 每頁的進場順序：依 DOM 順序逐一出現。step = 每個元素間隔毫秒 */
const SEQ = {
  cover:   { sel: '.kicker, h1, h2, .meta span', step: 140, base: 250 },
  why:     { sel: '.gaphd, .flowrow > *, .note, .kpi', step: 75 },
  steps:   { sel: '.step, .footnote, .shot', step: 130 },
  rules:   { sel: '.hub .rv, .hub .draw, .hubnote, .defs li, .chg', step: 90 },
  aimsg:   { sel: '.term, .tnote, .lp, .la, .back, .sg, .sa, .strip em', step: 110 },
  aigen:   { sel: '.gs, .gallery, .gim, .garr, .gchip, .gst, .gstat em', step: 90 },
  airoute: { sel: '.src, .arrows, .ck, .mid, .foot', step: 160 },
  todo:    { sel: '.todo .col', step: 120 },
  next:    { sel: '.next .card, .next .foot', step: 130 },
  lanes:   { sel: '.zones .z, .lane-legend', step: 120 },
  decide:  { sel: '.decide .card', step: 110 },
  closing: { sel: '.kicker, .role, .demo h3, .demo li, .qa', step: 130 },
};
slides.forEach((sl, si) => {
  const cfg = SEQ[slideData[si].type];
  const base = cfg.base ?? 200;
  let t = base;
  if (slideData[si].type !== 'cover') {
    sl.querySelectorAll('.eyebrow, .title, .subtitle').forEach(el => { el.classList.add('rv'); el.style.setProperty('--d', t + 'ms'); t += 90; });
  }
  sl.querySelectorAll(cfg.sel).forEach(el => {
    if (!el.classList.contains('draw')) el.classList.add('rv');
    el.style.setProperty('--d', t + 'ms'); t += cfg.step;
  });
  // swimlane: header columns sweep left→right, cells follow column by column (wave)
  if (slideData[si].type === 'lanes') {
    const kids = [...sl.querySelectorAll('.lane-grid > *')];
    kids.forEach((el, k) => {
      const col = k % 10, row = Math.floor(k / 10);
      const target = el.classList.contains('cell') ? el.querySelectorAll('.st') : [el];
      const d = t + col * 90 + row * 35;
      if (el.classList.contains('cell')) { el.style.opacity = ''; }
      target.forEach(x => { x.classList.add('rv'); x.style.setProperty('--d', d + 'ms'); });
    });
    sl.querySelector('.lane-legend').style.setProperty('--d', (t + 10 * 90 + 300) + 'ms');
  }
  sl.dataset.end = t;
});

/* 數字跳動、對話框打字 */
let fxToken = 0;
function runFx(sl) {
  const token = ++fxToken;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  sl.querySelectorAll('[data-count]').forEach(el => {
    const to = +el.dataset.count, small = el.querySelector('small').outerHTML;
    const delay = parseFloat(el.closest('.rv')?.style.getPropertyValue('--d')) || 0;
    if (reduce) return;
    el.innerHTML = '0' + small;
    const t0 = performance.now() + delay;
    const tick = now => {
      if (token !== fxToken) { el.innerHTML = to + small; return; }
      const p = Math.min(1, Math.max(0, (now - t0) / 900));
      el.innerHTML = Math.round(to * (1 - Math.pow(1 - p, 3))) + small;
      if (p < 1) requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  });
  sl.querySelectorAll('.say[data-text]').forEach(el => {
    const full = el.dataset.text;
    if (reduce) { el.textContent = full; return; }
    const delay = (parseFloat(el.closest('.rv')?.style.getPropertyValue('--d')) || 0) + 500;
    el.textContent = ''; el.classList.add('typing');
    let n = 0;
    const type = () => {
      if (token !== fxToken) { el.textContent = full; el.classList.remove('typing'); return; }
      el.textContent = full.slice(0, ++n);
      if (n < full.length) setTimeout(type, 55); else setTimeout(() => el.classList.remove('typing'), 1200);
    };
    setTimeout(type, delay);
  });
}
const N = slides.length;
const dots = document.getElementById('dots');
dots.innerHTML = slides.map(() => '<i></i>').join('');
const dotEls = [...dots.children];
const notesEl = document.getElementById('notes');
let cur = 0;

function go(i) {
  cur = Math.max(0, Math.min(N - 1, i));
  slides.forEach((s, j) => { s.classList.toggle('active', j === cur); s.classList.toggle('before', j < cur); });
  runFx(slides[cur]);
  document.getElementById('progress').style.width = ((cur + 1) / N * 100) + '%';
  dotEls.forEach((dt, j) => dt.classList.toggle('on', j === cur));
  document.getElementById('navPos').textContent = `${String(cur + 1).padStart(2, '0')} / ${String(N).padStart(2, '0')}`;
  notesEl.innerHTML = `<b>${String(cur + 1).padStart(2, '0')}</b>${slideData[cur].notes || ''}`;
  const url = new URL(location.href);
  url.searchParams.set('page', cur + 1);
  history.replaceState(null, '', url);
}
function fit() {
  const s = Math.min(innerWidth / 1280, innerHeight / 720);
  stage.style.transform = `translate(-50%, -50%) scale(${s})`;
}
dotEls.forEach((dt, j) => dt.addEventListener('click', () => go(j)));
document.getElementById('prev').onclick = () => go(cur - 1);
document.getElementById('next').onclick = () => go(cur + 1);
addEventListener('keydown', e => {
  if (['ArrowRight', 'PageDown', ' '].includes(e.key)) { e.preventDefault(); go(cur + 1); }
  else if (['ArrowLeft', 'PageUp'].includes(e.key)) { e.preventDefault(); go(cur - 1); }
  else if (e.key === 'Home') go(0);
  else if (e.key === 'End') go(N - 1);
  else if (e.key === 'n' || e.key === 'N') notesEl.classList.toggle('open');
});
addEventListener('resize', fit);
fit();
const p = parseInt(new URLSearchParams(location.search).get('page'), 10);
go(Number.isFinite(p) ? p - 1 : 0);
</script>
</body>
</html>
