<!doctype html>
<meta charset="utf-8">
<title>全端組｜開發流程 · 交接規範 · 團隊知識庫</title>
<style>
  :root {
    --teal: #0D9488;
    --gray: #8A8A8A;
    --ink: #2B2B2B;
    --muted: #7A7A7A;
    --line: #E7E4DB;
    --amber-bg: #FAEEDA;
    --amber-ink: #854F0B;
    --amber-line: #EF9F27;
  }

  * {
    box-sizing: border-box
  }

  body {
    margin: 0;
    background: #fff;
    color: var(--ink);
    font-family: "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", "Heiti TC", sans-serif;
    -webkit-font-smoothing: antialiased;
    line-height: 1.65;
  }

  .wrap {
    max-width: 1180px;
    margin: 0 auto;
    padding: 26px 26px 60px
  }

  h2 {
    font-size: 19px;
    margin: 6px 0 4px;
    font-weight: 800
  }

  .sechead {
    margin: 6px 0 14px
  }

  .sechead .k {
    font: 600 12px/1 ui-monospace, Consolas, monospace;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: #A9A69C;
    margin-bottom: 8px
  }

  .tabs {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
    flex-wrap: wrap
  }

  .tab {
    border: none;
    cursor: pointer;
    padding: 10px 20px;
    border-radius: 10px;
    font: 600 15px/1 inherit;
    color: #5a5a5a;
    background: #EFEFEF;
    transition: .18s;
  }

  .tab:hover {
    background: #e4e4e4
  }

  .tab.active {
    color: #fff
  }

  .tab.active[data-k="before"] {
    background: var(--gray)
  }

  .tab.active[data-k="now"] {
    background: var(--teal)
  }

  .head {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 6px
  }

  .pill {
    color: #fff;
    font-weight: 700;
    font-size: 17px;
    padding: 8px 16px;
    border-radius: 9px;
    white-space: nowrap
  }

  .sub {
    color: var(--muted);
    font-size: 14px;
    margin: 10px 2px 4px;
    line-height: 1.6
  }

  .sub b {
    color: var(--teal)
  }

  .legend {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12.5px;
    color: var(--muted);
    margin: 14px 2px 0
  }

  .legend .swatch {
    width: 22px;
    height: 15px;
    border: 2.6px solid var(--teal);
    border-radius: 4px;
    display: inline-block
  }

  .legend .swatch.plan {
    border-color: #5B4FC2;
    border-style: dashed
  }

  .legend .sep {
    display: inline-block;
    width: 16px
  }

  svg {
    width: 100%;
    height: auto;
    display: block;
    margin-top: 10px;
    transition: opacity .18s
  }

  .methods {
    margin-top: 16px
  }

  .mnote {
    background: #F1F0FB;
    border: 1.5px solid #D8D5F2;
    border-radius: 12px;
    padding: 13px 18px
  }

  .mh {
    font: 700 12px/1 ui-monospace, Consolas, monospace;
    letter-spacing: .1em;
    color: #5B4FC2;
    display: block;
    margin-bottom: 8px
  }

  .mrow {
    font-size: 13px;
    color: #3f3f3f;
    margin: 4px 0;
    line-height: 1.55
  }

  .mrow b {
    color: #2B2B2B
  }

  .mtag {
    display: inline-block;
    font: 700 11px/1 ui-monospace, Consolas, monospace;
    color: #fff;
    background: #5B4FC2;
    border-radius: 5px;
    padding: 2px 7px;
    margin-right: 8px
  }

  /* handoff table */
  .tintro {
    font-size: 13px;
    color: var(--muted);
    margin: 0 2px 14px;
    line-height: 1.7
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden
  }

  thead th {
    background: #F1EFE8;
    text-align: left;
    font-weight: 700;
    color: var(--ink);
    padding: 10px 12px;
    border-bottom: 1px solid var(--line);
    font-size: 12.5px;
    white-space: nowrap
  }

  tbody td {
    padding: 11px 12px;
    border-bottom: 1px solid var(--line);
    vertical-align: top
  }

  tbody tr:last-child td {
    border-bottom: none
  }

  tr.contract td {
    background: #FDF8EE
  }

  .num {
    color: #A9A69C;
    font: 600 12px ui-monospace, Consolas, monospace;
    width: 22px
  }

  .flow {
    white-space: nowrap;
    font-weight: 600
  }

  .flow .ar {
    color: #A9A69C;
    padding: 0 3px
  }

  .prod {
    font-weight: 600;
    min-width: 104px
  }

  .cell ul {
    margin: 0;
    padding-left: 15px
  }

  .cell li {
    padding: 1px 0;
    line-height: 1.5;
    color: #4c4c4c
  }

  .bd li {
    color: var(--ink)
  }

  .tag {
    display: inline-block;
    font: 600 11px/1 ui-monospace, Consolas, monospace;
    border-radius: 5px;
    padding: 2px 6px;
    margin-top: 5px;
    border: 1px solid;
    white-space: nowrap
  }

  .tag-contract {
    background: var(--amber-bg);
    color: var(--amber-ink);
    border-color: var(--amber-line)
  }

  .ai-core {
    display: inline-block;
    font-size: 11.5px;
    font-weight: 700;
    color: #fff;
    background: var(--teal);
    border-radius: 6px;
    padding: 3px 7px;
    line-height: 1.35
  }

  .ai-assist {
    display: inline-block;
    font-size: 11.5px;
    color: #0B5F59;
    background: #EAF6F4;
    border: 1px solid #9DD8CE;
    border-radius: 6px;
    padding: 3px 7px;
    line-height: 1.35
  }

  .ai-manual {
    display: inline-block;
    font-size: 11.5px;
    color: #8A8A8A
  }

  /* topic divider */
  .divider {
    margin: 44px 0 28px;
    border: none;
    border-top: 2px solid var(--line)
  }

  .topicmark {
    display: inline-block;
    font: 600 12px/1 ui-monospace, Consolas, monospace;
    letter-spacing: .1em;
    color: #A9A69C;
    background: #fff;
    padding: 0 12px;
    transform: translateY(-50%);
    position: relative;
    margin-left: 6px
  }

  /* knowledge base */
  .subtabs {
    display: flex;
    gap: 8px;
    margin: 2px 0 16px;
    flex-wrap: wrap
  }

  .subtab {
    border: 1.5px solid #d8d8d8;
    background: #fff;
    cursor: pointer;
    padding: 7px 15px;
    border-radius: 20px;
    font: 600 13.5px/1 inherit;
    color: #666;
    transition: .15s
  }

  .subtab:hover {
    border-color: var(--teal);
    color: var(--teal)
  }

  .subtab.on {
    background: var(--teal);
    border-color: var(--teal);
    color: #fff
  }

  .cards {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    margin-top: 24px
  }

  .card {
    flex: 1 1 330px;
    min-width: 300px;
    display: flex;
    gap: 14px;
    align-items: flex-start;
    background: #FAFAFA;
    border: 1.5px solid #EDEDED;
    border-radius: 14px;
    padding: 16px 18px;
    transition: .15s
  }

  .card.lead {
    border-color: var(--teal);
    background: #F1FAF9;
    box-shadow: 0 3px 12px rgba(13, 148, 136, .10)

  .ic {
    flex: 0 0 46px;
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background: var(--teal);
    display: flex;
    align-items: center;
    justify-content: center
  }

  .ic svg {
    width: 24px;
    height: 24px;
    margin: 0
  }

  .card h3 {
    margin: 0 0 5px;
    font-size: 16px;
    display: flex;
    align-items: center;
    gap: 8px
  }

  .rtag {
    font-size: 11px;
    font-weight: 700;
    color: #fff;
    background: var(--teal);
    border-radius: 6px;
    padding: 2px 7px
  }

  .card p {
    margin: 0;
    font-size: 13px;
    color: #5c5c5c;
    line-height: 1.55
  }

  /* kb summary + modal */
  .kb-summary {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    flex-wrap: wrap;
    background: #F1FAF9;
    border: 1.5px solid #BEE6E0;
    border-radius: 14px;
    padding: 18px 22px
  }

  .kb-sum-title {
    font-size: 17px;
    font-weight: 800;
    color: #0B5F59
  }

  .kb-sum-desc {
    margin: 5px 0 0;
    font-size: 13px;
    color: #4c6b67;
    line-height: 1.6;
    max-width: 640px
  }

  .kb-open {
    border: none;
    cursor: pointer;
    background: var(--teal);
    color: #fff;
    font: 700 14px/1 inherit;
    padding: 12px 20px;
    border-radius: 10px;
    white-space: nowrap;
    transition: .15s
  }

  .kb-open:hover {
    background: #0B5F59
  }

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(30, 30, 30, .5);
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 40px 20px;
    overflow: auto;
    z-index: 50;
    animation: fade .18s ease
  }

  @keyframes fade {
    from {
      opacity: 0
    }

    to {
      opacity: 1
    }
  }

  .modal {
    position: relative;
    background: #fff;
    border-radius: 16px;
    max-width: 1080px;
    width: 100%;
    padding: 30px 32px 34px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, .25)
  }

  .modal-close {
    position: absolute;
    top: 14px;
    right: 16px;
    border: none;
    background: #F0F0F0;
    cursor: pointer;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    font-size: 20px;
    line-height: 1;
    color: #555;
    transition: .15s
  }

  .modal-close:hover {
    background: #e2e2e2
  }

  #kbnode,
  #sddnode,
  #testnode,
  #artnode {
    cursor: pointer
  }

  #kbnode:hover,
  #sddnode:hover,
  #testnode:hover,
  #artnode:hover {
    opacity: .88
  }

  .mm-row {
    display: flex;
    gap: 16px;
    padding: 14px 0;
    border-bottom: 1px solid var(--line)
  }

  .mm-row:last-child {
    border-bottom: none
  }

  .mm-k {
    flex: 0 0 62px;
    font-weight: 800;
    color: #2B2B2B;
    font-size: 14.5px;
    padding-top: 1px
  }

  .mm-row b {
    font-size: 14px
  }

  .mm-row p {
    margin: 5px 0 0;
    font-size: 13px;
    color: #5c5c5c;
    line-height: 1.55
  }

  .mm-badge {
    display: inline-block;
    font: 700 11px/1 ui-monospace, Consolas, monospace;
    border-radius: 6px;
    padding: 3px 7px;
    vertical-align: middle
  }

  .mm-badge.plan {
    color: #fff;
    background: #5B4FC2
  }

  .mm-badge.now {
    color: #0B5F59;
    background: #EAF6F4;
    border: 1px solid #9DD8CE
  }

  /* roadmap in modal */
  .rmap {
    margin-top: 26px;
    border-top: 1px solid var(--line);
    padding-top: 20px
  }

  .rmap-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    margin-bottom: 14px
  }

  .rmap-head h3 {
    margin: 0;
    font-size: 16px;
    font-weight: 800
  }

  .rtrack {
    display: flex;
    align-items: center;
    gap: 4px
  }

  .rdot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    display: inline-block
  }

  .rline {
    width: 30px;
    height: 2px;
    background: #DDD;
    display: inline-block
  }

  .rdot.doing {
    background: var(--teal)
  }

  .rdot.plan {
    background: #5B4FC2
  }

  .rdot.todo {
    background: #B9B9B9
  }

  .rphases {
    display: flex;
    gap: 14px;
    flex-wrap: wrap
  }

  .rphase {
    flex: 1 1 240px;
    min-width: 210px;
    border: 1.5px solid #EDEDED;
    border-radius: 12px;
    padding: 15px 16px;
    background: #FAFAFA
  }

  .rphase.todo {
    border-style: dashed
  }

  .rbadge {
    font: 700 11px/1 ui-monospace, Consolas, monospace;
    color: #fff;
    border-radius: 6px;
    padding: 3px 8px
  }

  .rbadge.doing {
    background: var(--teal)
  }

  .rbadge.plan {
    background: #5B4FC2
  }

  .rbadge.todo {
    background: #9A9A9A
  }

  .rp-t {
    font-weight: 800;
    font-size: 14.5px;
    margin: 9px 0 5px
  }

  .rphase p {
    margin: 0;
    font-size: 12.5px;
    color: #5c5c5c;
    line-height: 1.55
  }

  .rlist {
    margin: 8px 0 0;
    padding-left: 16px
  }

  .rlist li {
    font-size: 12.5px;
    color: #5c5c5c;
    line-height: 1.5;
    margin: 3px 0
  }

  /* method modal */
  .mm {
    max-width: 720px
  }

  .mm p {
    font-size: 14px;
    color: #3f3f3f;
    line-height: 1.7;
    margin: 0 0 12px
  }

  .mm-pos {
    font-size: 13.5px;
    color: #4c4c4c;
    background: #F6F6F9;
    border-radius: 10px;
    padding: 12px 15px;
    margin-bottom: 14px
  }

  .mm-pos b {
    color: #2B2B2B;
    margin-right: 8px
  }

  .mm-tag {
    display: inline-block;
    font: 700 12px/1 ui-monospace, Consolas, monospace;
    border: 1.5px dashed;
    border-radius: 6px;
    padding: 5px 10px
  }

  /* TDD cycle */
  .tdd-cycle {
    display: flex;
    align-items: stretch;
    gap: 8px;
    flex-wrap: wrap;
    margin: 14px 0 16px
  }

  .tdd-step {
    flex: 1 1 180px;
    min-width: 168px;
    border: 1.5px solid;
    border-radius: 12px;
    padding: 13px 15px;
    background: #fff
  }

  .tdd-n {
    display: inline-flex;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    color: #fff;
    font: 800 12px ui-monospace, Consolas, monospace;
    align-items: center;
    justify-content: center
  }

  .tdd-t {
    font-weight: 800;
    font-size: 14.5px;
    margin: 7px 0 4px
  }

  .tdd-step p {
    margin: 0;
    font-size: 12.5px;
    color: #5c5c5c;
    line-height: 1.5
  }

  .tdd-step.red {
    border-color: #F3B4B0;
    background: #FDF3F2
  }

  .tdd-step.red .tdd-n {
    background: #E8352B
  }

  .tdd-step.red .tdd-t {
    color: #B42318
  }

  .tdd-step.green {
    border-color: #A8DCC0;
    background: #F0FAF4
  }

  .tdd-step.green .tdd-n {
    background: #16A34A
  }

  .tdd-step.green .tdd-t {
    color: #0F7A38
  }

  .tdd-step.blue {
    border-color: #BDD3F0;
    background: #F1F6FD
  }

  .tdd-step.blue .tdd-n {
    background: #2F6FBF
  }

  .tdd-step.blue .tdd-t {
    color: #1E4E8C
  }

  .tdd-step.purple {
    border-color: #CFC9F0;
    background: #F4F2FC
  }

  .tdd-step.purple .tdd-n {
    background: #5B4FC2
  }

  .tdd-step.purple .tdd-t {
    color: #443a9e
  }

  .tdd-step.teal {
    border-color: #9DD8CE;
    background: #EEF9F7
  }

  .tdd-step.teal .tdd-n {
    background: #0D9488
  }

  .tdd-step.teal .tdd-t {
    color: #0B5F59
  }

  .tdd-arrow {
    display: flex;
    align-items: center;
    color: #C4C4C4;
    font-size: 22px;
    font-weight: 700
  }

  .tdd-arrow.loop {
    color: #5B4FC2
  }

  .tdd-note {
    font-size: 13px;
    color: #4c4c4c;
    background: #F6F6F9;
    border-radius: 10px;
    padding: 11px 14px;
    margin: 0 0 14px
  }
</style>

<div class="wrap">

  <!-- ============ 製程 ============ -->
  <div class="sechead">
    <div class="k">Section 1 · 製程</div>
    <h2>開發流程</h2>
  </div>

  <table id="handoff"></table>

</div>

<!-- 知識庫彈窗 -->

      `<div class="tdd-step purple"><span class="tdd-n">1</span><div class="tdd-t">寫規格</div><p>把功能寫成明確、結構化的規格：輸入輸出、行為、邊界情境。</p></div>` +
      `<div class="tdd-arrow">→</div>` +
      `<div class="tdd-step teal"><span class="tdd-n">2</span><div class="tdd-t">AI 生成</div><p>讓 AI 依規格產出程式（可一併產出測試），規格是唯一依據。</p></div>` +
      `<div class="tdd-arrow">→</div>` +
      `<div class="tdd-step blue"><span class="tdd-n">3</span><div class="tdd-t">對照驗收</div><p>人依規格檢查產出是否符合；不符就回頭修規格或重生成。</p></div>` +
      `<div class="tdd-arrow loop">↺</div>` +
      `</div>` +
      `<p class="tdd-note">規格是單一事實來源：需求一變，先改規格再重生成，而不是直接改程式——這讓 AI 開發有明確依據、產出可被客觀驗收。</p>` +
      `<div class="mm-pos"><b>位置</b>介於「待辦清單」與「設計」之間：先把待辦轉成明確規格，再進入設計與開發。</div>` +
      `<span class="mm-tag" style="color:${c};border-color:${c}">預計導入</span></div>`;
  }
  function tddContentHTML() {
    const c = "#5B4FC2";
    return `<div class="head"><span class="pill" style="background:${c}">TDD</span><h2 style="font-size:22px;margin:0">測試驅動開發</h2></div>` +
      `<div class="mm">` +
      `<p>先寫測試、再寫實作——用測試<b>牽引開發</b>，不只是事後驗證。核心是「紅 → 綠 → 重構」的循環：</p>` +
      `<div class="tdd-cycle">` +
      `<div class="tdd-step red"><span class="tdd-n">1</span><div class="tdd-t">紅 Red</div><p>先寫一個會失敗的測試，定義你要的行為與介面（等於先寫規格）。</p></div>` +
      `<div class="tdd-arrow">→</div>` +
      `<div class="tdd-step green"><span class="tdd-n">2</span><div class="tdd-t">綠 Green</div><p>寫剛好能讓測試通過的最少程式，先求會動。</p></div>` +
      `<div class="tdd-arrow">→</div>` +
      `<div class="tdd-step blue"><span class="tdd-n">3</span><div class="tdd-t">重構 Refactor</div><p>在測試保護下整理程式、去除重複，測試維持綠燈。</p></div>` +
      `<div class="tdd-arrow loop">↺</div>` +
      `</div>` +
      `<p class="tdd-note">每個小功能重複這個循環——所以 TDD 橫跨「開發 ↔ 測試」：測試先行、驅動設計，驗證與回歸保護只是副產品。</p>` +
      `<div class="mm-pos"><b>位置</b>落在「開發 ↔ 測試」之間；與測試的 AI 化一起推進（AI 協助產生測試與實作）。</div>` +
      `<span class="mm-tag" style="color:${c};border-color:${c}">預計導入</span></div>`;
  }
  function artContentHTML() {
    const c = "#5B4FC2";
    return `<div class="head"><span class="pill" style="background:${c}">美術・Server</span><h2 style="font-size:22px;margin:0">交付給「開發」：預計導入 AI</h2></div>` +
      `<div class="mm">` +
      `<div class="mm-row"><span class="mm-k">美術</span><div><b>Figma AI to HTML</b> <span class="mm-badge plan">預計導入</span><p>直接把設計稿轉成前端 HTML／CSS，減少人工切版與還原落差。</p></div></div>` +
      `<div class="mm-row"><span class="mm-k">Server</span><div><b>以 Markdown 溝通 API</b> <span class="mm-badge now">現況順暢</span><p>改用 md 文件取代舊式 API 文件，交付清楚、版本好管理，溝通無痛。</p></div></div>` +
      `</div>`;
  }
  function openModal(key) {
    modalbody.innerHTML = key === "art" ? artContentHTML() : key === "sdd" ? sddContentHTML() : key === "tdd" ? tddContentHTML() : kbContentHTML();
    modal.style.display = "flex"; document.body.style.overflow = "hidden";
  }
  function closeModal() { modal.style.display = "none"; document.body.style.overflow = ""; }

  /* ---------- init ---------- */
  document.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => renderProc(t.dataset.k)));
  modalClose.addEventListener("click", closeModal);
  modal.addEventListener("click", e => { if (e.target === modal) closeModal(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });
  renderProc("now");
  renderTable();
</script>
